[package]
name = "henkei"
version = "0.2.0"
edition = "2021"
description = "Universal cross-platform web-to-desktop metamorphosis engine."
license = "MIT"
readme = "../README.md"
repository = "https://github.com/yourusername/henkei"
keywords = ["webview", "desktop", "cross-platform", "installer", "lightweight"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
henkei-scraper = { path = "../crates/henkei-scraper" }
henkei-builder = { path = "../crates/henkei-builder" }
henkei-runtime = { path = "../crates/henkei-runtime" }
serde_json = "1.0"
image = { version = "0.25", default-features = false }
url = "2.5"
dirs = "6.0"
