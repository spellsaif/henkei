[package]
name = "henkei-builder"
version = "0.2.0"
edition = "2021"
description = "Cross-platform packaging and installer engine for Henkei desktop apps."
license = "MIT"

[dependencies]
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
henkei-runtime = { path = "../henkei-runtime" }
henkei-scraper = { path = "../henkei-scraper" }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
] }
