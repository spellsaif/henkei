[package]
name = "henkei-runtime"
version = "0.2.0"
edition = "2021"
description = "High-performance cross-platform webview runner for Henkei desktop apps."
license = "MIT"

[dependencies]
wry = "0.57"
tao = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
open = "5.4"
dirs = "6.0"
url = "2.5"

[features]
default = []
embedded-config = []

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"
